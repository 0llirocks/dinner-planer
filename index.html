<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dinner">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Dinner Planner</title>
</head>
<body>
<main>
  <header>
    <div class="nav">
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="arrows">
        <button id="prev" type="button" aria-label="Vorherige Woche">‹</button>
        <button id="next" type="button" aria-label="Nächste Woche">›</button>
      </div>
    </div>
    <button id="jump" class="jump" type="button" hidden>Zur nächsten Woche</button>
  </header>
  <ul id="days"></ul>
</main>
<script src="app.js"></script>
</body>
</html>
